name: Central AI review and safe fixes
on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Configured target repository', required: true, type: string }
      pr_number: { description: 'Target pull request number', required: true, type: number }
      action: { description: 'Review or explicit safe fix request', required: true, default: review, type: choice, options: [review, fix] }
jobs:
  review:
    uses: ./.github/workflows/central-pr-automation.yml
    with:
      repository: ${{ inputs.repository }}
      pr_number: ${{ inputs.pr_number }}
      action: ${{ inputs.action }}
    secrets: inherit
