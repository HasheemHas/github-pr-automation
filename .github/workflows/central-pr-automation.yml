name: Central PR Automation

# Security boundaries, from the outside in:
#
#   plan                        no credentials at all
#   resolve-target              App read token, no target code executed
#   ai-analysis                 NVIDIA key only, no target code executed
#   prepare-validation-source   App read token, checkout only, no target code
#   ai-resolve-conflicts        NVIDIA key only, no target code executed
#   validate-target             NO credentials; this is where target code runs
#   report-to-target            App write token, no target code executed
#   privileged-fix-write        App write token, no target code executed
#
# Target-controlled code executes in exactly one job, and that job is given no
# secrets, no App token and no write credential. Every artifact is an explicit
# file list; $RUNNER_TEMP is never uploaded wholesale.

on:
  workflow_call:
    inputs:
      repository: { required: true, type: string }
      pr_number: { required: true, type: number }
      action: { required: true, type: string }
    secrets:
      GH_APP_ID: { required: true }
      # Optional: the App's Client ID (Iv23...). When set it is preferred over
      # GH_APP_ID, which create-github-app-token now only accepts as a deprecated
      # alias. Either value works as the JWT issuer.
      GH_APP_CLIENT_ID: { required: false }
      GH_APP_PRIVATE_KEY: { required: true }
      NVIDIA_API_KEY: { required: false }
  workflow_dispatch:
    inputs:
      repository:
        description: 'Allowlisted target repository name (without the owner prefix)'
        required: true
        type: string
      pr_number:
        description: 'Target pull request number'
        required: true
        type: number
      action:
        description: 'Operation to run'
        required: true
        default: all
        type: choice
        options: [all, metadata, labels, reviewers, review, security, quality, tests, fix, resolve-conflicts]

# Least privilege at the workflow level. Every write to the target repository goes
# through a short-lived GitHub App installation token, never through GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: central-pr-${{ inputs.repository }}-${{ inputs.pr_number }}-${{ inputs.action }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ---------------------------------------------------------------- plan -----
  # Runs before any credential exists. An unknown action, an unlisted repository
  # or a missing TARGET_ORG fails here, with no token in existence.
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.plan.outputs.owner }}
      repo: ${{ steps.plan.outputs.repo }}
      full_name: ${{ steps.plan.outputs.full_name }}
      plan: ${{ steps.plan.outputs.plan }}
      needs_ai: ${{ steps.plan.outputs.needs_ai }}
      needs_target_source: ${{ steps.plan.outputs.needs_target_source }}
      needs_privileged_write: ${{ steps.plan.outputs.needs_privileged_write }}
      needs_merge_probe: ${{ steps.plan.outputs.needs_merge_probe }}
      run_quality: ${{ steps.plan.outputs.run_quality }}
      run_security: ${{ steps.plan.outputs.run_security }}
      run_fix: ${{ steps.plan.outputs.run_fix }}
      run_resolve_conflicts: ${{ steps.plan.outputs.run_resolve_conflicts }}
      sandbox_enabled: ${{ steps.plan.outputs.sandbox_enabled }}
      sandbox_image: ${{ steps.plan.outputs.sandbox_image }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install central dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate action and target, then build the execution plan
        id: plan
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_ACTION: ${{ inputs.action }}
          TARGET_ORG: ${{ vars.TARGET_ORG }}
        run: python -m scripts.plan

  # ------------------------------------------------------- resolve-target -----
  # Holds a read-only App token. Fetches PR context over the API only: no
  # checkout of the target, no execution of target code.
  resolve-target:
    name: resolve-target
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      from_fork: ${{ steps.pr.outputs.from_fork }}
      file_count: ${{ steps.pr.outputs.file_count }}
      has_codeowners: ${{ steps.files.outputs.codeowners }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install central dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Mint a short-lived read token for the target repository
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID || secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ needs.plan.outputs.owner }}
          repositories: ${{ needs.plan.outputs.repo }}
          permission-contents: read
          permission-pull-requests: read
      - name: Fetch the exact target PR context
        id: pr
        env:
          TARGET_FULL_REPO: ${{ needs.plan.outputs.full_name }}
          TARGET_PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python -m scripts.github.get_pr
      - name: Re-materialise the plan alongside the context
        id: files
        env:
          PR_AUTOMATION_PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pr-automation-artifacts"
          # Written from the environment, never interpolated into the shell.
          printf '%s' "$PR_AUTOMATION_PLAN" > "$dir/plan.json"
          if [ -s "$dir/codeowners.txt" ]; then
            echo 'codeowners=true' >> "$GITHUB_OUTPUT"
          else
            echo 'codeowners=false' >> "$GITHUB_OUTPUT"
          fi
      # Explicit file list. $RUNNER_TEMP is never uploaded as a whole.
      - name: Upload sanitised PR context
        uses: actions/upload-artifact@v6
        with:
          name: pr-automation-context
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pr-automation-artifacts/pr-context.json
            ${{ runner.temp }}/pr-automation-artifacts/changed-files.json
            ${{ runner.temp }}/pr-automation-artifacts/pr.diff
            ${{ runner.temp }}/pr-automation-artifacts/plan.json
            ${{ runner.temp }}/pr-automation-artifacts/detected-commands.json
      - name: Upload CODEOWNERS when present
        uses: actions/upload-artifact@v6
        if: steps.files.outputs.codeowners == 'true'
        with:
          name: pr-automation-codeowners
          retention-days: 1
          path: ${{ runner.temp }}/pr-automation-artifacts/codeowners.txt

  # ----------------------------------------------------------- ai-analysis -----
  # Holds NVIDIA_API_KEY. Reads the sanitised context artifact. Never checks out
  # or executes target repository code.
  ai-analysis:
    name: ai-analysis
    needs: [plan, resolve-target]
    if: needs.plan.outputs.needs_ai == 'true' && needs.plan.outputs.run_resolve_conflicts != 'true'
    runs-on: ubuntu-latest
    # contents: read is the minimum that lets this job check out THIS repository.
    # It grants nothing on the target repository and cannot write anywhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install central dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: pr-automation-context
          path: ${{ runner.temp }}/pr-automation-artifacts
      - name: Run AI analysis
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_METADATA_MODEL: ${{ vars.AI_METADATA_MODEL }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          PR_AUTOMATION_PLAN: ${{ needs.plan.outputs.plan }}
        run: python -m scripts.ai.analyze
      - name: Detect a candidate patch
        id: files
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/pr-automation-artifacts/fix.patch" ]; then
            echo 'patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'patch=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload AI analysis
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr-automation-analysis
          retention-days: 1
          if-no-files-found: warn
          path: ${{ runner.temp }}/pr-automation-artifacts/analysis.json
      - name: Upload candidate patch
        uses: actions/upload-artifact@v6
        if: always() && steps.files.outputs.patch == 'true'
        with:
          name: pr-automation-candidate-patch
          retention-days: 1
          path: ${{ runner.temp }}/pr-automation-artifacts/fix.patch

  # --------------------------------------------- prepare-validation-source -----
  # Holds a read-only App token for the checkout, then hands the working tree on
  # as an artifact so the validation job needs no credentials. No target code is
  # executed here; git itself runs with hooks disabled.
  prepare-validation-source:
    name: prepare-validation-source
    needs: [plan, resolve-target]
    if: needs.plan.outputs.needs_target_source == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install central dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Mint a short-lived read token for the checkout
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID || secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ needs.plan.outputs.owner }}
          repositories: ${{ needs.plan.outputs.repo }}
          permission-contents: read
      - name: Check out the exact target head SHA
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.plan.outputs.full_name }}
          ref: ${{ needs.resolve-target.outputs.head_sha }}
          token: ${{ steps.app-token.outputs.token }}
          # No credential is written into target/.git, so the tree can safely be
          # handed to the credential-free validation job.
          persist-credentials: false
          # Quoted so the falsy-zero trap in GitHub expressions cannot bite.
          fetch-depth: ${{ needs.plan.outputs.needs_merge_probe == 'true' && '0' || '1' }}
          path: target
      - name: Probe for merge conflicts
        if: needs.plan.outputs.needs_merge_probe == 'true'
        env:
          TARGET_WORKDIR: target
          TARGET_BASE_REF: ${{ needs.resolve-target.outputs.base_ref }}
        run: python -m scripts.gitops.probe
      - name: Assert the handed-off tree carries no credentials
        run: |
          set -euo pipefail
          # persist-credentials: false should leave nothing behind. Fail loudly
          # rather than shipping a token inside an artifact.
          if grep -qE 'x-access-token|extraheader|AUTHORIZATION' target/.git/config; then
            echo '::error::Credential material found in target/.git/config.'
            exit 1
          fi
          git -C target config --unset-all http.extraheader 2>/dev/null || true
          tar -czf "$RUNNER_TEMP/target-source.tar.gz" target
          echo "Packed $(du -h "$RUNNER_TEMP/target-source.tar.gz" | cut -f1) of target source."
      - name: Upload target source for isolated validation
        uses: actions/upload-artifact@v6
        with:
          name: pr-automation-target-source
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/target-source.tar.gz
      - name: Upload merge conflict probe
        uses: actions/upload-artifact@v6
        if: needs.plan.outputs.needs_merge_probe == 'true'
        with:
          name: pr-automation-conflicts
          retention-days: 1
          if-no-files-found: warn
          path: ${{ runner.temp }}/pr-automation-artifacts/conflicts.json

  # ---------------------------------------------------- ai-resolve-conflicts ---
  # Holds NVIDIA_API_KEY. Sees only the conflicted hunks, never a credential and
  # never a shell running target code.
  ai-resolve-conflicts:
    name: ai-resolve-conflicts
    needs: [plan, resolve-target, prepare-validation-source]
    if: needs.plan.outputs.run_resolve_conflicts == 'true'
    runs-on: ubuntu-latest
    # contents: read is the minimum that lets this job check out THIS repository.
    # It grants nothing on the target repository and cannot write anywhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install central dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: pr-automation-context
          path: ${{ runner.temp }}/pr-automation-artifacts
      - uses: actions/download-artifact@v7
        with:
          name: pr-automation-conflicts
          path: ${{ runner.temp }}/pr-automation-artifacts
      - name: Resolve conflicts
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          RESOLVE_ALLOWED_PATHS: ${{ toJSON(fromJSON(needs.plan.outputs.plan).resolve_allowed_paths) }}
        run: python -m scripts.ai.resolve
      - name: Upload resolution
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr-automation-resolution
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pr-automation-artifacts/resolution.json
            ${{ runner.temp }}/pr-automation-artifacts/resolution.patch

  # ------------------------------------------------------- validate-target -----
  # THE ONLY JOB THAT EXECUTES TARGET-CONTROLLED CODE.
  # No App token, no private key, no NVIDIA key, no registry or cloud credential,
  # no write permission. It receives the target tree as an artifact.
  validate-target:
    name: validate-target
    # ai-analysis and ai-resolve-conflicts are listed so a candidate patch cannot
    # be validated before it has been produced. Either may legitimately be
    # skipped, which is why the guard is on prepare-validation-source only.
    needs: [plan, resolve-target, prepare-validation-source, ai-analysis, ai-resolve-conflicts]
    if: >-
      always() &&
      needs.prepare-validation-source.result == 'success' &&
      (needs.plan.outputs.run_quality == 'true' ||
       needs.plan.outputs.run_security == 'true' ||
       needs.plan.outputs.needs_privileged_write == 'true')
    runs-on: ubuntu-latest
    # contents: read is the minimum that lets this job check out THIS repository.
    # It grants nothing on the target repository and cannot write anywhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install central dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Download PR context for auto-detected commands
        uses: actions/download-artifact@v7
        with:
          name: pr-automation-context
          path: ${{ runner.temp }}/pr-automation-artifacts
      - uses: actions/download-artifact@v7
        with:
          name: pr-automation-target-source
          path: ${{ runner.temp }}/source
      - name: Unpack the target source
        run: tar -xzf "$RUNNER_TEMP/source/target-source.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Pull the sandbox image
        if: needs.plan.outputs.sandbox_enabled == 'true'
        env:
          SANDBOX_IMAGE: ${{ needs.plan.outputs.sandbox_image }}
        run: |
          set -euo pipefail
          # Pulled by the trusted host before any target command runs. The runners
          # below only ever `docker run` this already-present image.
          docker pull --quiet "$SANDBOX_IMAGE"
          docker image inspect "$SANDBOX_IMAGE" --format 'sandbox image: {{.Id}}'
      - name: Download the candidate patch
        uses: actions/download-artifact@v7
        if: needs.plan.outputs.run_fix == 'true'
        continue-on-error: true
        with:
          name: pr-automation-candidate-patch
          path: ${{ runner.temp }}/pr-automation-artifacts
      - name: Download the candidate resolution
        uses: actions/download-artifact@v7
        if: needs.plan.outputs.run_resolve_conflicts == 'true'
        continue-on-error: true
        with:
          name: pr-automation-resolution
          path: ${{ runner.temp }}/pr-automation-artifacts
      - name: Provision security scanners
        if: needs.plan.outputs.run_security == 'true'
        continue-on-error: true
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Validate a candidate patch BEFORE running the quality suite, so a patch is
      # only ever pushed after passing the suite with the patch applied.
      - name: Validate the candidate patch in isolation
        if: needs.plan.outputs.needs_privileged_write == 'true'
        continue-on-error: true
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_WORKDIR: target
          CONFIG_FILE: ${{ github.workspace }}/config/repositories.yml
          DETECTED_COMMANDS_FILE: ${{ runner.temp }}/pr-automation-artifacts/detected-commands.json
          PATCH_FILE: ${{ needs.plan.outputs.run_fix == 'true' && 'fix.patch' || 'resolution.patch' }}
          PATCH_ALLOWED_PATHS: >-
            ${{ needs.plan.outputs.run_fix == 'true'
                && toJSON(fromJSON(needs.plan.outputs.plan).fix_allowed_paths)
                || toJSON(fromJSON(needs.plan.outputs.plan).resolve_allowed_paths) }}
          PATCH_FORBIDDEN_PATHS: ${{ toJSON(fromJSON(needs.plan.outputs.plan).forbidden_patch_paths) }}
        run: python -m scripts.gitops.validate
      - name: Run configured quality commands
        if: needs.plan.outputs.run_quality == 'true'
        continue-on-error: true
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_WORKDIR: target
          CONFIG_FILE: ${{ github.workspace }}/config/repositories.yml
          DETECTED_COMMANDS_FILE: ${{ runner.temp }}/pr-automation-artifacts/detected-commands.json
          QUALITY_RESULT_FILE: ${{ runner.temp }}/pr-automation-artifacts/quality-result.json
        run: python -m scripts.quality.run
      - name: Run configured security scanners
        if: needs.plan.outputs.run_security == 'true'
        continue-on-error: true
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_WORKDIR: target
          CONFIG_FILE: ${{ github.workspace }}/config/repositories.yml
          DETECTED_COMMANDS_FILE: ${{ runner.temp }}/pr-automation-artifacts/detected-commands.json
          SECURITY_RESULT_FILE: ${{ runner.temp }}/pr-automation-artifacts/security-result.json
        run: python -m scripts.security.run
      # Only the result JSON files leave this job. Never the source, never a log
      # dump, never the runner temp directory.
      - name: Upload validation results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr-automation-validation
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pr-automation-artifacts/quality-result.json
            ${{ runner.temp }}/pr-automation-artifacts/security-result.json
      - name: Upload the validated patch
        uses: actions/upload-artifact@v6
        if: always() && needs.plan.outputs.needs_privileged_write == 'true'
        with:
          name: pr-automation-validated-patch
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pr-automation-artifacts/patch-validation.json
            ${{ runner.temp }}/pr-automation-artifacts/validated-patch.diff

  # ------------------------------------------------------- report-to-target -----
  # Holds a write-capable App token. Consumes only sanitised result artifacts and
  # executes no target code. Optional artifacts are downloaded defensively: a
  # skipped job, a failed job and a job that crashed before uploading are three
  # distinct outcomes, all rendered as NOT RUN rather than a crash.
  report-to-target:
    name: report-to-target
    needs: [plan, resolve-target, ai-analysis, validate-target, ai-resolve-conflicts]
    if: always() && needs.plan.result == 'success' && needs.resolve-target.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install central dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Download PR context
        uses: actions/download-artifact@v7
        with:
          name: pr-automation-context
          path: ${{ runner.temp }}/pr-automation-artifacts
      # Each optional download is gated on whether its producer actually ran, so a
      # legitimately absent artifact is not surfaced as a red annotation.
      # continue-on-error stays as a backstop for a producer that died mid-upload.
      - name: Download CODEOWNERS
        uses: actions/download-artifact@v7
        if: needs.resolve-target.outputs.has_codeowners == 'true'
        continue-on-error: true
        with:
          name: pr-automation-codeowners
          path: ${{ runner.temp }}/pr-automation-artifacts
      - name: Download AI analysis
        uses: actions/download-artifact@v7
        if: needs.ai-analysis.result != 'skipped'
        continue-on-error: true
        with:
          name: pr-automation-analysis
          path: ${{ runner.temp }}/pr-automation-artifacts
      - name: Download validation results
        uses: actions/download-artifact@v7
        if: needs.validate-target.result != 'skipped'
        continue-on-error: true
        with:
          name: pr-automation-validation
          path: ${{ runner.temp }}/pr-automation-artifacts
      - name: Mint a short-lived write token for the target repository
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID || secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ needs.plan.outputs.owner }}
          repositories: ${{ needs.plan.outputs.repo }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
          permission-checks: write
      - name: Update the target PR and publish the quality gate
        env:
          TARGET_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_AUTOMATION_PLAN: ${{ needs.plan.outputs.plan }}
          RESULT_DIR: ${{ runner.temp }}/pr-automation-artifacts
          REVIEWERS_CONFIG: ${{ github.workspace }}/config/reviewers.yml
        run: python -m scripts.github.report
      - name: Upload the gate decision
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr-automation-gate
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/pr-automation-artifacts/gate.json

  # --------------------------------------------------- privileged-fix-write -----
  # Holds a write-capable App token. Runs NO target-repository command: no npm,
  # no pip, no test suite, no git hooks. It pushes only the exact patch bytes the
  # credential-free validation job approved, verified by SHA-256 digest, and only
  # while the PR head still matches the SHA that was analysed.
  privileged-fix-write:
    name: privileged-fix-write
    needs: [plan, resolve-target, validate-target]
    if: >-
      needs.plan.outputs.needs_privileged_write == 'true' &&
      needs.validate-target.result == 'success' &&
      needs.resolve-target.outputs.from_fork == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install central dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Download the validated patch
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: pr-automation-validated-patch
          path: ${{ runner.temp }}/pr-automation-artifacts
      - name: Stop unless a validated patch exists
        id: gate
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/pr-automation-artifacts/patch-validation.json"
          if [ ! -s "$file" ]; then
            echo 'No validated patch artifact; nothing to push.'
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          record = json.load(open(os.environ['RUNNER_TEMP'] + '/pr-automation-artifacts/patch-validation.json'))
          print('proceed=' + ('true' if record.get('status') == 'validated' else 'false'))
          print('reason=' + str(record.get('reason', ''))[:200])
          PY
      - name: Mint a short-lived write token
        id: app-token
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID || secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ needs.plan.outputs.owner }}
          repositories: ${{ needs.plan.outputs.repo }}
          permission-contents: write
          permission-pull-requests: read
      - name: Check out the target head for the push
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.plan.outputs.full_name }}
          ref: ${{ needs.resolve-target.outputs.head_sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: target
      - name: Apply and push the validated patch
        if: steps.gate.outputs.proceed == 'true'
        env:
          TARGET_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_FULL_REPO: ${{ needs.plan.outputs.full_name }}
          TARGET_PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_HEAD_REF: ${{ needs.resolve-target.outputs.head_ref }}
          TARGET_HEAD_SHA: ${{ needs.resolve-target.outputs.head_sha }}
          TARGET_WORKDIR: target
          PATCH_ALLOWED_PATHS: >-
            ${{ needs.plan.outputs.run_fix == 'true'
                && toJSON(fromJSON(needs.plan.outputs.plan).fix_allowed_paths)
                || toJSON(fromJSON(needs.plan.outputs.plan).resolve_allowed_paths) }}
          PATCH_FORBIDDEN_PATHS: ${{ toJSON(fromJSON(needs.plan.outputs.plan).forbidden_patch_paths) }}
          COMMIT_MESSAGE: >-
            ${{ needs.plan.outputs.run_fix == 'true'
                && 'fix: apply validated automated patch'
                || 'chore: apply validated merge conflict resolution' }}
        run: python -m scripts.gitops.push
      - name: Report why nothing was pushed
        if: steps.gate.outputs.proceed != 'true'
        run: |
          echo "::notice::No patch was pushed. ${{ steps.gate.outputs.reason }}"
