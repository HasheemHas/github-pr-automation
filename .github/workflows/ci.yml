name: Central automation CI

# Self-tests for this repository. No target repository is touched and no secret
# is used, so this runs safely on every pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compile every module
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Parse every workflow and config file
        run: |
          python - <<'PY'
          import sys, pathlib, yaml
          failures = []
          for path in sorted(pathlib.Path('.').glob('.github/workflows/*.yml')) + \
                      sorted(pathlib.Path('config').glob('*.yml')):
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              except yaml.YAMLError as exc:
                  failures.append(f'{path}: {exc}')
          for line in failures:
              print(f'::error::{line}')
          sys.exit(1 if failures else 0)
          PY
      - name: Check that no key material is committed
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(pem|key|p12|pfx)$|private-key'; then
            echo '::error::Key-shaped files are tracked in this repository.'
            exit 1
          fi
          if git grep -lIE 'BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY' -- . ':!.github/workflows/ci.yml'; then
            echo '::error::A private key block is committed in this repository.'
            exit 1
          fi
          echo 'No key material tracked.'

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Lint workflow syntax
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
