name: Central release preparation
on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Configured target repository', required: true, type: string }
      pr_number: { description: 'Merged target pull request number', required: true, type: number }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Release preparation is intentionally not automated yet.'
          echo 'A target release needs an explicit versioning policy and a GitHub App Contents-write approval.'
          exit 1
