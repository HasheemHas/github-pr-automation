name: Verify AI model availability

# Diagnostic. Confirms the configured model IDs exist on the configured endpoint
# before you debug a pipeline failure as a prompt problem. Prints model IDs and a
# verdict only; NVIDIA_API_KEY is never printed and nothing is uploaded.

on:
  workflow_dispatch:
  schedule:
    # Weekly, so a provider retiring a model surfaces before a PR run needs it.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install central dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check configured models against the endpoint
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_METADATA_MODEL: ${{ vars.AI_METADATA_MODEL }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: python -m scripts.ai.check_models
