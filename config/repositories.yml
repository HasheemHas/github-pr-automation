# Central configuration for target repositories.
#
# Repository names are relative to the TARGET_ORG Actions variable, so
# TARGET_ORG=mycompany plus repository=yshrm resolves to mycompany/yshrm.
#
# Resolution order for any dispatched repository:
#   1. an explicit entry under `repositories:` merged over `defaults:`
#   2. otherwise `defaults:` alone, when defaults.enabled is true
#   3. otherwise a hard failure in the `plan` job, before any token is minted
#
# So with defaults.enabled: true you can point the pipeline at ANY repository in
# the organisation without editing this file. The GitHub App installation is
# still the real authorisation boundary: a repository the App is not installed on
# fails at token minting regardless of what this file says.
#
# Commands run in a credential-free job against the target's PR head and may
# execute target-authored code, so never add a command that needs a secret.

defaults:
  # true  = any repository in TARGET_ORG may be targeted, using this profile
  # false = every repository must have an explicit entry below (strict allowlist)
  enabled: true
  # Repositories that may never be targeted, even with enabled: true.
  deny: []
  security:
    gitleaks: true
    semgrep: false
    trivy: false
  metadata:
    title_policy: weak

    # Which sections the managed description block contains, and in what order.
    # An empty section is omitted automatically, so listing one costs nothing.
    #   at_glance  details  behaviour  test_plan  type  user_impact
    #   description  change_type  risk  components  changes  release_notes
    #   breaking  migration  testing  review_focus  rollback  related_issues  stats
    sections:
      - at_glance
      - details
      - test_plan
      - type
      - user_impact
      - release_notes

    # Section headings, so the block matches your house style.
    headings:
      at_glance: At a Glance
      details: Details
      behaviour: Behaviour
      test_plan: Test Plan
      type: Type
      user_impact: User Impact
      release_notes: Release Notes

    # ---------------------------------------------------------------------
    # `template:` is an OPTIONAL OVERRIDE, and it is deliberately empty.
    #
    # By default every line of the description is DERIVED from the diff by
    # scripts/insights/describe.py:
    #   at_glance    change type, reviewable scale, notable signals, risk + why
    #   details      per file: the functions, classes, workflow jobs, config keys
    #                or headings it added and removed — build artefacts and lock
    #                files are collapsed into one line, never listed
    #   test_plan    the tests that actually cover the changed files, the files
    #                nothing covers, and the coverage figure
    #   user_impact  stated only where a real signal supports it (API, schema,
    #                migration, UI, config); otherwise says what was checked
    #
    # Setting a key below REPLACES the derived content for that key with a fixed
    # string. That is almost never what you want: a template rendered once per
    # path produces "Update `<path>`." repeated down the page, which is what this
    # config used to do. Set one only when a wording must be fixed by policy.
    #
    # Placeholders available: {subject} {components} {component} {change_type}
    # {risk} {risk_lower} {files} {additions} {deletions} {commits} {path}
    #
    # template:
    #   summary: "{subject}"
    #   detail_item: "Update `{path}`."          # overrides derived Details
    #   testing_item: "Run checks for {component}."   # overrides derived Test Plan
    #   user_impact: "..."                        # overrides derived User Impact
    #   review_focus_item: "Review `{path}`."
    #   release_note: "{subject}."
    #   rollback: "Revert the pull request commit and redeploy the previous revision."
    #   risk_reasons:
    #     high: "..."
    #     medium: "..."
    #     low: "..."
    template: {}
  review:
    inline_comments: true
  sandbox:
    enabled: false
    image: ''

  # ---------------------------------------------------------------- reviewers --
  reviewers:
    # defer   report CODEOWNERS ownership, let GitHub request the owners (default)
    # request request the CODEOWNERS owners explicitly as well
    # ignore  do not read CODEOWNERS at all
    codeowners: defer

  # ------------------------------------------------------------ size and risk --
  # Advisory by default: it reports, it does not block. Set fail_on_violation to
  # true to turn a breach of max_files / max_lines into a failing gate.
  size_policy:
    warn_files: 20          # above this, the PR is flagged as large
    warn_lines: 500
    max_files: 60           # above this, it is a policy breach
    max_lines: 1500
    max_commits: 0          # 0 disables the commit-count check
    max_concerns: 2         # unrelated areas before "mixed change" is reported
    fail_on_violation: false
    count_generated: false  # lock files and vendored trees are counted separately
    # ignore_paths: []      # excluded from the counts entirely
    # generated_paths: []   # overrides the built-in generated-file list

  # -------------------------------------------------------------- secret scan --
  # Runs on the added lines in the analysis job, with no binary to provision.
  # Complements gitleaks; it is not a replacement for it. Detected values are
  # masked and are never written to a log, an artifact or a PR comment.
  secret_scan:
    enabled: true
    fail_on: high           # critical | high | medium | low, or '' to never fail
    min_entropy: 3.0        # applies only to the generic, non-provider patterns
    max_findings: 100
    # allow_paths: []       # added to the built-in example/fixture allowlist

  # -------------------------------------------------------- dependency change --
  dependency_policy:
    enabled: true
    fail_on: ''             # '' = advisory; set to high to block
    allow_major_bumps: true
    allow_vcs_sources: false
    # allow_packages: []    # glob patterns exempt from reporting

  # ---------------------------------------------------------------- migrations --
  migration_policy:
    enabled: true
    fail_on: ''             # '' = advisory; set to high to block
    require_rollback: true  # a new migration should have a reverse path
    require_naming: true
    max_per_pr: 0           # 0 disables the count check
    allow_editing_applied: false
    # ignore_paths: []

  # ----------------------------------------------------- API compatibility ----
  api_policy:
    enabled: true
    fail_on: ''             # '' = advisory; set to high to block breaking changes
    check_routes: true
    check_symbols: true
    check_schemas: true
    # internal_paths: []    # added to the built-in internal/test path list
    # public_paths: []      # when set, ONLY these paths are checked

  # -------------------------------------------------- changed-line coverage ----
  # Measures whether the lines this PR adds are executed by a test. Needs the
  # test command to emit a coverage report; formats supported are Cobertura XML,
  # LCOV, coverage.py JSON, Istanbul JSON, JaCoCo, Clover and Go coverprofile.
  coverage:
    enabled: true
    min_changed_line_coverage: 0   # 0 = measure and report only, never fail
    fail_under: true               # false = warn instead of fail
    min_changed_lines: 10          # below this, the percentage is not enforced
    treat_unmeasured_as_uncovered: false
    # command: ''                  # optional command that produces the report
    # reports: []                  # explicit report globs; empty = auto-discover
    # exclude_paths: []            # added to the built-in test/generated excludes

  # ------------------------------------------------------------ flaky tests ----
  # OFF by default: it re-runs the whole test suite `runs` times.
  flaky:
    enabled: false
    runs: 3
    fail_on_flaky: false
    # command: ''                  # defaults to the configured test commands
    # reports: []                  # JUnit XML globs; empty = auto-discover

  # --------------------------------------------------------- release notes ----
  release_notes:
    enabled: true
    include_issue_refs: true
    include_internal: false        # true also lists chore/ci/test commits
    max_per_section: 25

  # ------------------------------------------------------- merge readiness ----
  # The single ready / not ready answer. `block_on` names the dimensions that
  # hold the merge; a dimension that is enabled but did NOT run also holds it,
  # because a check that never ran is not a pass.
  #   review conflicts draft lint test build dependencies_install security
  #   secrets coverage flaky tests review_rules api migrations deps size metadata
  readiness:
    require_approvals: 1
    allow_draft: false
    block_on: [lint, test, build, security, secrets, conflicts, review]
  # Auto-fix stays off by default: `action=fix` needs both a sandbox image and a
  # non-empty allowlist, so an unconfigured repository can never be written to.
  fix_allowed_paths: []
  resolve_allowed_paths: []
  # No `commands:` here on purpose. A repository with no explicit commands gets
  # them auto-detected from its own manifests (package.json, composer.json,
  # requirements.txt, go.mod, Cargo.toml, Gemfile, pom.xml, *.csproj) by
  # scripts/common/detect.py. Declare commands below only to override detection.

repositories:
  yshrm:
    enabled: true
    type: fullstack
    commands:
      install:
        - name: Backend dependencies
          run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
        - name: Frontend dependencies
          run: npm --prefix frontend ci --ignore-scripts
        - name: Admin dependencies
          run: npm --prefix admin ci --ignore-scripts
      lint:
        - name: Backend syntax
          run: >-
            python -c "import pathlib,sys;
            [compile(p.read_bytes(), str(p), 'exec')
             for p in pathlib.Path('backend/app').rglob('*.py')]"
        - name: Frontend lint
          run: npm --prefix frontend run lint
        - name: Admin lint
          run: npm --prefix admin run lint
      test:
        - name: Backend tests
          run: >-
            sh -c 'if [ -d backend/tests ] || [ -d tests ];
            then python -m pytest -q; else echo "no python tests configured"; fi'
      build:
        - name: Frontend build
          run: npm --prefix frontend run build
        - name: Admin build
          run: npm --prefix admin run build
    security:
      gitleaks: true
      semgrep: false
      trivy: false
    metadata:
      # weak   replace only a placeholder PR title ("update", "fix", "Update x.py")
      # always replace whenever automation proposes something different
      # never  never touch the title
      title_policy: weak
      # Sections of the managed PR description block, in order. Remove any you do
      # not want. An empty section is omitted automatically, so listing one costs
      # nothing when the PR has nothing to say for it.
      #   description  change_type  risk       components  changes
      #   release_notes  breaking   migration  testing     review_focus
      #   rollback     related_issues  stats
      sections:
        - at_glance
        - details
        - behaviour
        - test_plan
        - type
        - user_impact
        - release_notes
    review:
      inline_comments: true
    # Only the keys that differ from `defaults:` need restating; nested blocks
    # merge key by key.
    coverage:
      enabled: true
      # The backend test command needs to emit a report for this to measure
      # anything; pytest-cov writes coverage.xml with --cov-report=xml.
      command: >-
        sh -c 'if [ -d backend/tests ] || [ -d tests ];
        then python -m pytest -q --cov --cov-report=xml:coverage.xml || true;
        else echo "no python tests configured"; fi'
      reports:
        - coverage.xml
        - frontend/coverage/lcov.info
        - admin/coverage/lcov.info
      # Start advisory. Raise this once the baseline is known, then set
      # fail_under: true to make it a gate.
      min_changed_line_coverage: 0
    size_policy:
      warn_files: 25
      warn_lines: 600
    readiness:
      require_approvals: 1
      block_on: [lint, test, build, security, secrets, conflicts, review]
    # Container isolation for target-controlled commands. The validation job holds
    # no credentials either way; this stops target code reaching the central
    # scripts or the validation artifacts. REQUIRED for action=fix and
    # action=resolve-conflicts: without it those actions refuse to run.
    sandbox:
      enabled: false
      image: ''            # e.g. a pinned image digest carrying node 22 + python 3.12
      required_binaries: [sh, node, npm, python3]
      isolate_network: false   # true = network only for the install group
      network_groups: [install]
      memory: 4g
      pids_limit: 512
    # Paths an automation-authored patch may modify. Empty means fixes are disabled.
    # The global deny list in scripts/plan.py always wins.
    fix_allowed_paths:
      - backend/app/**/*.py
      - frontend/src/**
      - admin/src/**
    resolve_allowed_paths:
      - backend/app/**/*.py
      - frontend/src/**
      - admin/src/**

  ecommerce-main:
    enabled: true
    type: php
    commands:
      install:
        - name: Composer dependencies
          run: composer install --no-interaction --no-progress --prefer-dist --working-dir=backend
        - name: AI microservice dependencies
          run: >-
            sh -c 'if [ -f backend/ai_microservice/requirements.txt ];
            then python3 -m pip install --disable-pip-version-check
            -r backend/ai_microservice/requirements.txt;
            else echo "no python requirements"; fi'
      lint:
        # find -exec continues past a failing file, so EVERY syntax error is
        # reported. xargs aborts on php -l's exit status 255 and shows only the
        # first one.
        - name: PHP syntax
          run: >-
            sh -c 'errors=$(find . -path ./vendor -prune -o -name "*.php"
            -exec php -l {} \; 2>&1 | grep -v "^No syntax errors");
            [ -z "$errors" ] || { printf "%s\n" "$errors"; exit 1; }'
        - name: Python syntax
          run: >-
            python3 -c "import pathlib;
            [compile(p.read_bytes(), str(p), 'exec')
             for p in pathlib.Path('.').rglob('*.py')
             if 'vendor' not in p.parts]"
      # No PHPUnit configuration in the repository yet, so tests report NOT RUN
      # rather than silently passing. Add a phpunit entry once one exists.
      test: []
      build: []
    security:
      # This repository is public, so a committed secret is exposed to everyone.
      gitleaks: true
      semgrep: false
      trivy: false
    metadata:
      title_policy: weak
    review:
      inline_comments: true
    sandbox:
      enabled: false
      image: ''
    # Auto-fix stays off until a sandbox image is configured; both lists empty
    # means action=fix is refused for this repository.
    fix_allowed_paths: []
    resolve_allowed_paths: []

  # Example. Set enabled: true only after the GitHub App is installed there.
  yshrms-api:
    enabled: false
    type: python
    commands:
      install:
        - name: Dependencies
          run: python -m pip install --disable-pip-version-check -r requirements.txt
      lint:
        - name: Ruff
          run: ruff check .
      test:
        - name: Pytest
          run: python -m pytest -q
      build: []
    security:
      gitleaks: true
      semgrep: true
      trivy: false
    metadata:
      title_policy: weak
    sandbox:
      enabled: false
      image: ''
    fix_allowed_paths: []
    resolve_allowed_paths: []
