# Central reviewer routing. Applied to every target repository.
#
# Rules enforced by scripts/common/reviewers.py:
#   * the PR author is never requested
#   * duplicates, and reviewers already requested on the PR, are skipped
#   * existing reviewers are preserved (reviewers are only ever added)
#   * a user or team that GitHub cannot resolve is reported, not fatal
#
# CODEOWNERS in the target repository is parsed properly and reported per file
# and per owner, whatever the mode. The mode only decides who does the
# requesting, and is set per repository under `reviewers.codeowners` in
# config/repositories.yml:
#   defer    (default) GitHub assigns the owners itself when CODEOWNERS covers
#            every changed file; the groups below still fill any gap it leaves
#   request  the owners are requested explicitly as well
#   ignore   CODEOWNERS is not read; only the groups below apply
#
# Fill in real GitHub logins and team slugs (without the org prefix). Leaving a
# group empty is valid: it matches, reports "no assignable reviewers", and does
# not fail the run.
reviewers:
  backend:
    paths:
      - "backend/**"
    users: []
    teams: []

  frontend:
    paths:
      - "frontend/**"
      - "admin/**"
    users: []
    teams: []

  devops:
    paths:
      - "terraform/**"
      - "helm/**"
      - ".github/workflows/**"
      - "**/Dockerfile"
      - "docker-compose.*"
    users: []
    teams: []

  security:
    paths:
      - "**/auth/**"
      - "security/**"
    users: []
    teams: []
